<!doctype html><html lang="zh-CN" data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>头像额度圆环 · 模拟预览</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;background:#f7f7f4;color:#282a26}button,input{font:inherit}button{cursor:pointer}main{min-height:100vh;display:flex}.rail{width:70px;flex-shrink:0;display:flex;align-items:center;flex-direction:column;padding:20px 0 26px;background:#edeee8;border-right:1px solid #dedfd6;min-height:600px}.logo{font-size:23px}.rail>span{margin-top:25px;color:#767b6e;font-size:20px}.spacer{flex:1}#account{width:32px;height:32px;padding:0;border:0;border-radius:50%;background:#797d56;color:white;font-size:11px;display:grid;place-items:center;outline-offset:7px}.content{padding:64px 8vw;width:min(900px,100%)}.eyebrow{font-size:11px;letter-spacing:.18em;color:#787f6c}h1{font-size:32px;font-weight:550;letter-spacing:-1px;line-height:1.3;margin:16px 0}.lead{color:#787c70;max-width:540px}.panel{margin-top:40px;background:#fff;border:1px solid #e2e5d9;border-radius:18px;padding:26px;max-width:560px}.value{font-size:56px;letter-spacing:-3px;line-height:1.2;margin:8px 0 24px}.muted{color:#858979;font-size:12px}input{display:block;width:100%;accent-color:#a8ba50;margin:20px 0}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{background:#f6f7f1;border:1px solid #e0e3d5;color:#5b634d;border-radius:9px;padding:7px 12px}.note{max-width:530px;font-size:12px;color:#868b7c;margin-top:24px}body.dark{background:#20221f;color:#e5e8df}body.dark .rail{background:#191b18;border-color:#30342b}body.dark .panel{background:#282b25;border-color:#3a3e32}body.dark .buttons button{background:#30352a;border-color:#434c34;color:#d4dfbd}#account-status{margin-top:20px;min-height:20px;color:#747c64;font-size:12px}@media(max-width:600px){.content{padding:36px 22px}h1{font-size:26px}}
</style>
<main><nav class="rail" aria-label="模拟应用侧栏"><div class="logo">◎</div><span>⌂</span><span>▤</span><span>＋</span><div class="spacer"></div><button id="account" aria-label="模拟用户头像">A</button></nav>
<section class="content"><div class="eyebrow">CODEX · QUOTA RING</div><h1>额度，轻轻围在头像外。</h1><p class="lead">细黄绿色圆环对应剩余额度。悬停或用键盘聚焦左下角头像，查看数值与周期。</p>
<div class="panel"><div class="muted">Codex 周额度 · 模拟数据</div><div class="value" id="reading">89<span style="font-size:24px;letter-spacing:0">%</span></div><label for="remaining">剩余百分比</label><input id="remaining" type="range" min="0" max="100" value="89"><div class="buttons"><button id="reset">89% 示例</button><button id="missing">数据不可用</button><button id="stale">数据过期</button><button id="theme">切换深浅色</button></div><div id="account-status" role="status"></div></div>
<p class="note">这是独立模拟页面，不是已经注入的客户端。页面没有账号连接，不读取凭据。实际内嵌需要另行审阅调试连接与头像定位；客户端更新可能使定位失效。</p></section></main>
<script type="module" src="/demo.mjs"></script></html>
