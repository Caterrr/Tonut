name: Tonut checks
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build:preview
      - name: Compile own macOS helper; no host restart or install
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          xcrun clang -fobjc-arc -O2 -Wall -Wextra -Werror -arch arm64 -arch x86_64 -mmacosx-version-min=12.0 -framework AppKit -framework ApplicationServices macos/startup/bridge.m -o dist/startup-bridge
          codesign --force --sign - --timestamp=none dist/startup-bridge
          codesign --verify --strict dist/startup-bridge
      - name: Parse PowerShell and compile Windows native adapter without running it
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($File in @('windows/manage.ps1','startup/windows-bridge.ps1')) {
            $Tokens=$null; $Errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $File),[ref]$Tokens,[ref]$Errors) | Out-Null
            if($Errors.Count) {throw ($Errors | Out-String)}
          }
          Add-Type -Path (Join-Path $PWD 'startup/windows-native.cs') -ReferencedAssemblies System.Management,System.Core,System.Windows.Forms
