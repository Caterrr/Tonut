name: Tonut release checks
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:preview
      - name: Browser regression with unchanged animation and reset-credit unknown/zero cases
        if: runner.os == 'Linux'
        run: |
          CHROME_PATH="$(command -v google-chrome)" npm run test:browser
      - name: Compile and test own macOS kernel install guard
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          xcrun clang -fobjc-arc -O2 -Wall -Wextra -Werror -arch arm64 -arch x86_64 -mmacosx-version-min=12.0 -framework AppKit -framework ApplicationServices macos/startup/bridge.m -o dist/startup-bridge
          codesign --force --sign - --timestamp=none dist/startup-bridge
          codesign --verify --strict dist/startup-bridge
          node test/native-mutex.mjs "$PWD/dist/startup-bridge"
      - name: Windows parsing compilation kernel recovery and simulated Store update
        if: runner.os == 'Windows'
        shell: powershell
        run: ./test/windows-platform.ps1
      - run: node scripts/package.mjs
